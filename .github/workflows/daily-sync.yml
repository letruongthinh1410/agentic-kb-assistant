name: Daily OptiBot Sync

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Runs automatically every day at 02:00 UTC.
  schedule:
    - cron: "0 2 * * *"

  # Allows manual triggering from the Actions tab for testing / demo purposes.
  workflow_dispatch:

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  sync:
    name: Scrape → Delta → Upload
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Prevent concurrent runs (e.g. if a manual trigger overlaps the schedule).
    concurrency:
      group: daily-sync
      cancel-in-progress: false

    steps:
      # ── 1. Check out the repository ──────────────────────────────────────────
      # fetch-depth: 0 ensures git can commit state.json back afterward.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Show state.json from previous run (informational) ──────────────────
      - name: Show previous state summary
        run: |
          if [ -f state.json ]; then
            echo "state.json found — $(python3 -c "import json; d=json.load(open('state.json')); print(len(d))") article(s) tracked from previous run."
          else
            echo "No state.json — first run, all articles will be treated as new."
          fi

      # ── 3. Build the Docker image ─────────────────────────────────────────────
      # This uses the Dockerfile at the root of the repo, ensuring the exact
      # same runtime environment as a local `docker run` call.
      - name: Build Docker image
        run: docker build -t optibot .

      # ── 4. Run the Dockerized pipeline ───────────────────────────────────────
      #
      # Key design decisions:
      #   - Secrets are injected via -e flags (never hardcoded in this file).
      #   - The workspace directory is mounted to /app/state inside the container
      #     so that state.json written by main.py is visible on the runner after
      #     the container exits (needed for the git commit step below).
      #   - STATE_FILE overrides the default path so main.py writes to the mount.
      #   - --rm removes the container automatically after it exits.
      - name: Run sync pipeline (Docker)
        id: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_STORE_NAME: ${{ secrets.GEMINI_STORE_NAME }}
        run: |
          docker run --rm \
            -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
            -e GEMINI_STORE_NAME="${GEMINI_STORE_NAME}" \
            -e STATE_FILE=/app/state/state.json \
            -v "${{ github.workspace }}:/app/state" \
            optibot

      # ── 5. Commit updated state.json back to the repo ────────────────────────
      #
      # WHY if: always():
      #   By default, GitHub Actions skips subsequent steps when a previous step
      #   fails. Without if: always(), a pipeline crash would prevent state.json
      #   from being committed — losing any partial progress already written to
      #   disk during the run. With if: always(), partial progress is preserved
      #   and the next run resumes where this one left off instead of re-uploading
      #   everything from scratch.
      #
      # WHY [skip ci] in the commit message:
      #   Prevents this bot commit from triggering another workflow run (infinite
      #   loop prevention).
      - name: Commit updated state.json
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "state.json unchanged — nothing to commit."
          else
            git commit -m "chore: update state.json [skip ci]"
            git push
          fi

      # ── 6. Propagate pipeline failure to the job status ───────────────────────
      #
      # Because the commit step runs with if: always(), the job would otherwise
      # appear as "succeeded" even if the pipeline step failed (the commit step
      # would be the last step and it would succeed). This final step re-raises
      # the failure so that GitHub, monitoring tools, and email notifications
      # correctly report the job as failed.
      - name: Fail job if pipeline failed
        if: always()
        run: |
          if [ "${{ steps.pipeline.outcome }}" = "failure" ]; then
            echo "Pipeline step failed — propagating failure to job status."
            exit 1
          fi
          echo "Pipeline step outcome: ${{ steps.pipeline.outcome }} — job complete."
